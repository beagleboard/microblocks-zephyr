name: Release

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags:
      - VM*

jobs:
  build:
    strategy:
      matrix:
        - zephyr_board: beagleconnect_freedom@C7/cc1352p7
          board: beagleconnect-freedom
    name: Build Artifacts - MicroBlocks stable for ${{ matrix.board }}
    runs-on: ubuntu-latest
    env:
      OS_LIST_DESC: "MicroBlocks is a blocks programming language for physical computing inspired by Scratch."
      OS_LIST_ICON: "https://raw.githubusercontent.com/beagleboard/bb-imager-rs/refs/heads/main/assets/os/microblocks.svg"
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        path: microblocks

    - name: Setup Zephyr project
      uses: zephyrproject-rtos/action-zephyr-setup@v1
      with:
        app-path: microblocks
        toolchains: arm-zephyr-eabi

    - name: Fetch blobs
      run: west blobs fetch -a

    - name: Build firmware
      run: west build -p -b ${{ matrix.zephyr_board }} microblocks -d build

    - name: Rename and compress firmware
      run: |
        mkdir dist
        VM=$(cat modules/microblocks/gp/runtime/versions | grep VM | awk '{print $2}')
        BIN_NAME=dist/${{ matrix.board }}.bin
        mv build/zephyr/zephyr.bin $BIN_NAME
        xz -z $BIN_NAME

    - name: Generate OS List
      run: |
        VM=$(cat modules/microblocks/gp/runtime/versions | grep VM | awk '{print $2}')
        ./os_list.py ${VM}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: github.ref_type != 'tag'
      with:
        path: dist/*

    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        generate_release_notes: true
        files: |
          dist/*

